services:
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: taskmanager-frontend:local
    restart: unless-stopped
    networks: [appnet]
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: taskmanager-backend:local
    restart: unless-stopped
    environment:
      DB_PATH: /data/tasks.db
    volumes:
      - task_data:/data
    networks: [appnet]
  nginx:
    image: nginx:1.27-alpine
    depends_on: [frontend, backend]
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    restart: unless-stopped
    networks: [appnet]
networks:
  appnet:
volumes:
  task_data:
